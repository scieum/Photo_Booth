<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과학의 날 포토부스 - 나와 닮은 과학자는?</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 파티클 배경 -->
    <div class="particles" id="particles"></div>

    <!-- 인트로 화면 -->
    <section id="intro" class="screen active">
        <img src="image/home.png" alt="과학의 날 포토부스" class="intro-bg" />
        <button class="btn-start" onclick="startQuiz()" aria-label="시작하기">
            <img src="image/start.png" alt="START" />
        </button>
    </section>

    <!-- 퀴즈 화면 -->
    <section id="quiz" class="screen">
        <button class="btn-home" onclick="goToIntro()" aria-label="홈으로 돌아가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12L12 3l9 9"></path>
                <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path>
            </svg>
            <span>홈</span>
        </button>
        <div class="quiz-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="question-counter">
                <span id="currentQ">1</span> / 5
            </div>
            <div class="question-area" id="questionArea">
                <!-- 질문이 JS로 렌더링됨 -->
            </div>
        </div>
    </section>

    <!-- 결과 분석 중 화면 -->
    <section id="analyzing" class="screen">
        <div class="analyzing-content">
            <div class="dna-loader">
                <div class="helix">
                    <div class="strand strand-1"></div>
                    <div class="strand strand-2"></div>
                </div>
            </div>
            <h2>분석 중...</h2>
            <p id="analyzingText">당신의 과학적 성향을 분석하고 있습니다</p>
        </div>
    </section>

    <!-- 결과 화면 -->
    <section id="result" class="screen">
        <button class="btn-home" onclick="goToIntro()" aria-label="홈으로 돌아가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12L12 3l9 9"></path>
                <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path>
            </svg>
            <span>홈</span>
        </button>
        <div class="result-container">
            <p class="result-eyebrow">당신과 가장 결이 맞는 과학자</p>
            <article class="result-card" id="resultCard">
                <header class="result-header">
                    <p class="scientist-type" id="scientistType"></p>
                    <h1 class="scientist-name" id="scientistName"></h1>
                    <p class="scientist-name-en" id="scientistNameEn"></p>
                </header>
                <blockquote class="scientist-quote" id="scientistQuote"></blockquote>
                <p class="scientist-desc" id="scientistDesc"></p>
                <footer class="result-footer">
                    <p class="traits-label">키워드</p>
                    <ul class="traits" id="scientistTraits"></ul>
                </footer>
            </article>
            <div class="result-actions">
                <button class="btn-photo" onclick="goToPhotoBooth()">포토부스로 가기</button>
                <button class="btn-retry" onclick="retryQuiz()">다시 해보기</button>
            </div>
        </div>
    </section>

    <!-- 포토부스 화면 -->
    <section id="photobooth" class="screen">
        <div class="pb-stage" id="pbStage">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="frameCanvas" aria-hidden="true"></canvas>
            <div class="pb-flash" id="pbFlash" aria-hidden="true"></div>
            <div class="pb-countdown" id="pbCountdown" aria-hidden="true"></div>

            <div class="pb-top">
                <button class="btn-home pb-home" onclick="exitPhotoBooth()" aria-label="홈으로 돌아가기">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M3 12L12 3l9 9"></path>
                        <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path>
                    </svg>
                    <span>홈</span>
                </button>
                <div class="pb-counter">
                    <span id="pbPhotoCount">0</span><span class="pb-counter-divider">/</span><span>4</span>
                </div>
            </div>

            <div class="pb-bottom">
                <p class="pb-hint" id="pbHint">버튼을 누르면 3초 후 촬영됩니다</p>
                <button class="pb-shutter" id="pbShutter" onclick="takePhoto()" aria-label="촬영">
                    <span class="pb-shutter-inner"></span>
                </button>
            </div>

            <div class="pb-error" id="pbError" hidden>
                <h3>카메라를 사용할 수 없어요</h3>
                <p id="pbErrorMsg">브라우저에서 카메라 권한을 허용해주세요.</p>
                <button class="btn-retry" onclick="initPhotoBooth()">다시 시도</button>
            </div>
        </div>
    </section>

    <!-- 스티커 결과 화면 -->
    <section id="sticker" class="screen">
        <button class="btn-home" onclick="exitToIntro()" aria-label="홈으로 돌아가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12L12 3l9 9"></path>
                <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"></path>
            </svg>
            <span>홈</span>
        </button>
        <div class="sticker-container">
            <p class="sticker-eyebrow">완성된 스티커</p>
            <h2 class="sticker-title">오늘의 포토부스</h2>
            <div class="sticker-canvas-wrap">
                <canvas id="stickerCanvas"></canvas>
            </div>
            <div class="sticker-actions">
                <button class="btn-photo" onclick="downloadSticker()">스티커 저장하기</button>
                <button class="btn-retry" onclick="retakePhotos()">다시 찍기</button>
            </div>
        </div>
    </section>

    <script src="js/script.js"></script>
</body>
</html>
